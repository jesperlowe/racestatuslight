substitutions:
  device_name: nordschleife-led-lamp
  friendly_name: Nordschleife LED Lamp
  led_pin: GPIO18
  led_count: "60"
  led_sections: "12"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -10
    then:
      - light.turn_on:
          id: nordschleife_leds
          brightness: 80%
          effect: Race Status

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

logger:

api:
  encryption:
    key: !secret nordschleife_led_lamp_api_key
  services:
    - service: set_race_status
      variables:
        mode: string
        section: int
      then:
        - lambda: |-
            if (!mode.empty()) {
              char first = mode[0];
              if (first >= 'a' && first <= 'z') {
                first = first - 'a' + 'A';
              }
              id(current_mode) = std::string(1, first);
            }
            if (section < 0) {
              section = 0;
            }
            if (section >= ${led_sections}) {
              section = ${led_sections} - 1;
            }
            id(active_section) = section;
        - light.turn_on:
            id: nordschleife_leds
            brightness: 80%
            effect: Race Status

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: current_mode
    type: std::string
    restore_value: no
    initial_value: '"O"'
  - id: active_section
    type: int
    restore_value: no
    initial_value: '0'

light:
  - platform: esp32_rmt_led_strip
    id: nordschleife_leds
    name: Track LEDs
    pin: ${led_pin}
    num_leds: ${led_count}
    chipset: ws2812
    rgb_order: GRB
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: Race Status
          update_interval: 100ms
          lambda: |-
            static const uint16_t section_start[${led_sections}] = {0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55};
            static const uint16_t section_end[${led_sections}] = {4, 9, 14, 19, 24, 29, 34, 39, 44, 49, 54, 59};

            Color base_color(8, 8, 8);
            if (id(current_mode) == "R") {
              base_color = Color(255, 0, 0);
            } else if (id(current_mode) == "Q") {
              base_color = Color(255, 180, 0);
            } else if (id(current_mode) == "P") {
              base_color = Color(0, 255, 0);
            }

            for (int i = 0; i < it.size(); i++) {
              it[i] = base_color;
            }

            int section = id(active_section);
            if (section < 0) {
              section = 0;
            }
            if (section >= ${led_sections}) {
              section = ${led_sections} - 1;
            }

            uint16_t start_led = section_start[section];
            uint16_t end_led = section_end[section];
            if (start_led >= it.size()) {
              return;
            }
            if (end_led >= it.size()) {
              end_led = it.size() - 1;
            }

            for (uint16_t i = start_led; i <= end_led; i++) {
              it[i] = Color(0, 0, 255);
            }
